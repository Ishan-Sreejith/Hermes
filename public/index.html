<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #212121;
        --surface: #262626;
        --surface-elevated: #2d2d2d;
        --surface-hover: #353535;
        --border: #3d3d3d;
        --text: #f5f5f5;
        --text-muted: #b0b0b0;
        --text-dim: #8e8e8e;
        --accent: #6d8df3;
        --accent-hover: #86a1f8;
        --accent-muted: #38435f;
        --accent-glow: rgba(109, 141, 243, 0.12);
        --success: #34d399;
        --danger: #f87171;
        --bubble-me: #3f4d6f;
        --bubble-them: #2d2d2d;
        --bubble-thread: #2b2b2b;
      }
      :root[data-theme='light'] {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-elevated: #f7f7f8;
        --surface-hover: #f0f0f2;
        --border: #e6e6e8;
        --text: #111111;
        --text-muted: #6a6a6f;
        --text-dim: #9b9ba1;
        --accent: #4c71e8;
        --accent-hover: #5f82ec;
        --accent-muted: #dfe7ff;
        --accent-glow: rgba(76, 113, 232, 0.09);
        --bubble-me: #e5ecff;
        --bubble-them: #f7f7f8;
        --bubble-thread: #f1f1f3;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        line-height: 1.5;
      }
      .mono { font-family: 'JetBrains Mono', monospace; }

      .app {
        height: 100vh;
        display: grid;
        grid-template-columns: 64px 280px minmax(0, 1fr);
      }
      .app.sidebar-hidden {
        grid-template-columns: 64px minmax(0, 1fr);
      }
      .app.sidebar-hidden .sidebar {
        display: none;
      }

      .rail {
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 12px;
        gap: 4px;
      }
      .logo {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--surface-elevated);
        border: 1px solid var(--border);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 15px;
        margin-bottom: 8px;
      }
      .rail-btn {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }
      .rail-btn:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .rail-btn.active {
        background: var(--accent-glow);
        color: var(--accent);
      }
      .spacer { flex: 1; }

      .sidebar {
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: grid;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }
      .sidebar-header {
        padding: 20px;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .sidebar-sub {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: 2px;
        font-family: 'JetBrains Mono', monospace;
      }
      .search-wrap {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        display: grid;
        gap: 8px;
      }
      .search-input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
      }
      .search-input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .peer-search-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      .peer-results {
        list-style: none;
        max-height: 160px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-elevated);
      }
      .peer-results li {
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
      }
      .peer-results li:last-child {
        border-bottom: none;
      }
      .peer-results li:hover {
        background: var(--surface-hover);
      }

      .chat-list {
        list-style: none;
        overflow-y: auto;
        padding: 8px;
      }
      .chat-item {
        padding: 12px 14px;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.12s ease;
        margin-bottom: 2px;
      }
      .chat-item:hover { background: var(--surface-hover); }
      .chat-item.active { background: var(--accent-glow); }
      .chat-item-name {
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chat-item.active .chat-item-name { color: var(--accent); }
      .chat-item-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
      }
      .chat-item-preview {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }
      .chat-item-time {
        font-size: 11px;
        color: var(--text-dim);
      }

      .main {
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--bg);
        overflow: hidden;
      }
      .chat-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .chat-header-left {
        display: flex;
        flex-direction: column;
      }
      .chat-title {
        font-size: 17px;
        font-weight: 600;
      }
      .chat-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 2px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--success);
      }
      .chat-meta-text {
        font-size: 12px;
        color: var(--text-muted);
      }
      .chat-typing {
        font-size: 12px;
        color: var(--accent);
        margin-top: 3px;
      }
      .header-actions {
        display: flex;
        gap: 8px;
      }

      .messages {
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .date-separator {
        text-align: center;
        padding: 16px 0;
        font-size: 12px;
        color: var(--text-dim);
        font-family: 'JetBrains Mono', monospace;
      }
      .msg-row {
        display: flex;
        gap: 12px;
        max-width: 75%;
      }
      .msg-row.me {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .msg-row.them { align-self: flex-start; }
      .msg-row.system {
        align-self: center;
        max-width: 90%;
      }
      .msg-row.system .bubble {
        background: var(--surface);
        border: 1px solid var(--border);
        text-align: center;
      }

      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--surface-elevated);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 12px;
        flex-shrink: 0;
      }
      .avatar.me { background: var(--accent); color: #fff; }
      .avatar.them { background: var(--border); }

      .bubble {
        padding: 10px 14px;
        border-radius: 16px;
        background: var(--bubble-them);
        border: 1px solid var(--border);
      }
      .msg-row.me .bubble {
        background: var(--bubble-me);
        border-color: var(--accent-muted);
        color: var(--text);
        border-bottom-right-radius: 4px;
      }
      .msg-row.them .bubble {
        border-bottom-left-radius: 4px;
      }
      .from {
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      .msg-row.me .from { color: var(--text-muted); }
      .body {
        font-size: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .time {
        font-size: 10px;
        color: var(--text-dim);
        margin-top: 4px;
        text-align: right;
      }
      .msg-row.me .time { color: var(--text-dim); }

      .composer {
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 16px 24px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      #message-input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px 16px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      #message-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-glow);
      }
      #message-input::placeholder { color: var(--text-dim); }

      .btn {
        border: 1px solid var(--border);
        background: var(--surface-elevated);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn:hover {
        background: var(--surface-hover);
        border-color: var(--text-muted);
      }
      .btn-primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      #send-btn {
        padding: 12px 20px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
      }
      .overlay.open { display: flex; }
      .modal {
        width: min(420px, 90vw);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
      }
      .modal-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .modal-sub {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 20px;
      }
      .modal-field {
        margin-bottom: 16px;
      }
      .modal-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-muted);
        margin-bottom: 6px;
        display: block;
      }
      .modal-input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
      }
      .modal-input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: var(--text-dim);
      }
      .empty-icon {
        font-size: 34px;
        margin-bottom: 16px;
        opacity: 0.3;
      }
      .empty-title {
        font-size: 16px;
        font-weight: 500;
        margin-bottom: 4px;
      }
      .empty-sub {
        font-size: 13px;
      }

      @media (max-width: 768px) {
        .app {
          grid-template-columns: 56px 1fr;
        }
        .app:not(.mobile) .sidebar {
          display: none;
        }
        .app.mobile .sidebar {
          display: block;
          position: fixed;
          left: 56px;
          top: 0;
          bottom: 0;
          width: 280px;
          z-index: 50;
        }
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <div class="overlay" id="settings-overlay">
      <div class="modal">
        <h2 class="modal-title">Settings</h2>
        <p class="modal-sub">Customize your Hermes experience</p>
        <div class="modal-field">
          <label class="modal-label">Display Name</label>
          <input class="modal-input" id="settings-name" placeholder="Anonymous" />
        </div>
        <div class="modal-field">
          <label class="modal-label">Quick Join Channel</label>
          <input class="modal-input" id="settings-target" value="@broadcast" />
        </div>
        <div class="modal-actions">
          <button class="btn" id="settings-close">Cancel</button>
          <button class="btn btn-primary" id="settings-save">Save</button>
        </div>
      </div>
    </div>

    <div class="app" id="app-root">
      <aside class="rail">
        <div class="logo">H</div>
        <button class="rail-btn" id="btn-broadcast" title="Broadcast">#</button>
        <button class="rail-btn" id="btn-menu" title="Menu">M</button>
        <button class="rail-btn" id="btn-settings" title="Settings">S</button>
        <div class="spacer"></div>
        <button class="rail-btn" id="btn-theme" title="Theme">T</button>
      </aside>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h1 class="sidebar-title">Chats</h1>
          <div class="sidebar-sub mono" id="sidebar-status">connecting...</div>
        </div>
        <div class="search-wrap">
          <input class="search-input" id="chat-filter" placeholder="Search chats" />
          <div class="peer-search-row">
            <input class="search-input" id="peer-search-input" placeholder="Find usernames" />
            <button class="btn" id="peer-search-btn">Search</button>
          </div>
          <ul class="peer-results" id="peer-search-results"></ul>
        </div>
        <ul class="chat-list" id="chat-list">
          <li class="chat-item active" data-channel="@broadcast">
            <div class="chat-item-name">#broadcast</div>
            <div class="chat-item-meta">
              <div class="chat-item-preview">General discussion</div>
            </div>
          </li>
        </ul>
      </aside>

      <main class="main">
        <header class="chat-header">
          <div class="chat-header-left">
            <h2 class="chat-title" id="chat-title">#broadcast</h2>
            <div class="chat-meta">
              <span class="status-dot"></span>
              <span class="chat-meta-text" id="chat-meta">connecting...</span>
            </div>
            <div class="chat-typing" id="chat-typing"></div>
          </div>
          <div class="header-actions">
            <button class="btn" id="btn-new-chat">+ New</button>
          </div>
        </header>

        <section class="messages" id="chat-messages">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon">O</div>
            <div class="empty-title">No messages yet</div>
            <div class="empty-sub">Start the conversation!</div>
          </div>
        </section>

        <footer class="composer">
          <input id="message-input" autocomplete="off" placeholder="Type a message..." />
          <button class="btn btn-primary" id="send-btn">Send</button>
        </footer>
      </main>
    </div>

    <script src="/firebase-config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
