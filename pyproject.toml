[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2pchat"
version = "0.3.3"
description = "Terminal-first P2P chat app with Hermes relay and localhost web UI"
requires-python = ">=3.10"
dependencies = [
  "cryptography",
  "flask",
  "textual>=0.63.0",
  "websockets>=10.0",
  "aiohttp>=3.8.0",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.0.0",
]
firebase = [
  "firebase-admin",
]
build = [
  "build>=1.2.2",
  "pyinstaller>=6.0.0",
]

[project.scripts]
p2pchat = "p2pchat.main:main"
hermes = "p2pchat.main:main"
hermes-server = "p2pchat.hermes_server:main"
web-ui = "p2pchat.web_ui.app:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["p2pchat*"]

[tool.setuptools.package-data]
"p2pchat.web_ui" = ["templates/*.html", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
