<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hermes Web</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233a8bfd'/%3E%3Cpath d='M20 35h60v10H20zM20 55h40v10H20z' fill='%23ffffff'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #111315;
        --surface: #1a1d21;
        --surface-2: #242931;
        --border: #323843;
        --text: #eceff4;
        --muted: #9aa4b7;
        --accent: #3b82f6;
        --accent-2: #2563eb;
        --danger: #d65c5c;
      }
      :root[data-theme='light'] {
        --bg: #f3f4f6;
        --surface: #ffffff;
        --surface-2: #f3f6fb;
        --border: #d7deea;
        --text: #1f2937;
        --muted: #667085;
        --accent: #10a37f;
        --accent-2: #0d8d6f;
        --danger: #c83f4a;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
      .app { display: grid; grid-template-columns: 300px minmax(0,1fr); height: 100dvh; transition: grid-template-columns .2s ease; }
      .app.sidebar-collapsed { grid-template-columns: 0 minmax(0,1fr); }
      .sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
      .sidebar.open { display: flex; }
      .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
      .sidebar-title { font-size: 24px; font-weight: 800; }
      .status { color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
      .status.good { color: #45d483; }
      .status.bad { color: var(--danger); }
      .toolbar { padding: 12px 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
      .btn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text); border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
      .btn:hover { border-color: var(--accent); }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .btn-danger { border-color: color-mix(in oklab, var(--danger) 40%, var(--border)); }
      .chat-list { overflow: auto; padding: 10px; }
      .chat-card { border: 1px solid transparent; border-radius: 10px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
      .chat-card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .chat-menu-trigger { border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-weight: 800; line-height: 1; }
      .chat-menu-trigger:hover { background: var(--surface-2); color: var(--text); }
      .chat-card:hover { background: var(--surface-2); }
      .chat-card.active { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--surface-2)); }
      .main { display: grid; grid-template-rows: 68px minmax(0,1fr); min-height: 0; }
      .chat-header { padding: 0 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); }
      .chat-header-left { display: flex; align-items: center; gap: 10px; }
      .chat-stage { min-height: 0; position: relative; display: flex; flex-direction: column; }
      .messages { overflow: auto; padding: 18px; padding-bottom: 120px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
      .msg { max-width: 70%; border-radius: 14px; padding: 10px 12px; background: var(--surface-2); }
      .msg.me { align-self: end; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
      .meta { font-size: 11px; color: var(--muted); }
      .header-actions { display: flex; align-items: center; gap: 8px; }
      .top-banner { display: none; padding: 10px 14px; font-size: 12px; border-bottom: 1px solid var(--border); color: #fff; background: #913640; }
      .top-banner.open { display: block; }
      .composer-wrap { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 18px 16px; pointer-events: none; }
      .composer { pointer-events: auto; border: 1px solid var(--border); display: flex; gap: 10px; padding: 10px; background: color-mix(in oklab, var(--surface) 88%, #000 12%); border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.25); backdrop-filter: blur(6px); }
      #message-input { flex: 1; border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--text); padding: 12px; font-size: 14px; outline: none; }
      #message-input:focus { border-color: var(--accent); background: color-mix(in oklab, var(--surface-2) 80%, transparent); }
      #sidebar-toggle, #sidebar-collapse { display: inline-flex; }
      .badge { margin-left: 6px; font-size: 10px; background: var(--danger); color: #fff; border-radius: 999px; padding: 1px 6px; }
      .chat-menu { position: fixed; min-width: 140px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 26px rgba(0,0,0,0.3); display: none; z-index: 80; padding: 6px; }
      .chat-menu.open { display: block; }
      .chat-menu button { width: 100%; text-align: left; border: 0; background: transparent; color: var(--text); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
      .chat-menu button:hover { background: var(--surface-2); }
      .chat-menu button.danger { color: #ff8d8d; }
      .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); }
      .modal.open { display: flex; }
      .modal-card { width: min(440px, 92vw); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
      .field { margin: 10px 0; }
      .field input { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px; background: var(--bg); color: var(--text); }
      .modal-actions { margin-top: 14px; display: flex; justify-content: flex-end; gap: 8px; }
      .auth-gate { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; z-index: 100; }
      .auth-gate.open { display: flex; }
      .auth-card { width: min(460px, 92vw); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
      .auth-title { margin: 0 0 6px; font-size: 24px; font-weight: 800; }
      .auth-sub { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
      .auth-error { margin-top: 10px; color: var(--danger); font-size: 12px; min-height: 16px; }
      @media (max-width: 860px) {
        .app { grid-template-columns: 1fr; height: 100dvh; }
        .sidebar { display: none; position: fixed; inset: 0 auto 0 0; width: min(92vw, 340px); z-index: 30; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.45); }
        #sidebar-collapse { display: none; }
      }
    </style>
  </head>
  <body>
    <section class="auth-gate" id="auth-gate">
      <div class="auth-card">
        <h1 class="auth-title">Welcome to Hermes</h1>
        <div class="auth-sub">Create local sign-in once for this browser.</div>
        <div class="field"><input id="auth-username" placeholder="Username" maxlength="20" /></div>
        <div class="field"><input id="auth-password" type="password" placeholder="Password" maxlength="64" /></div>
        <div class="modal-actions">
          <button class="btn" id="auth-continue">Continue</button>
        </div>
        <div class="auth-error" id="auth-error"></div>
      </div>
    </section>

    <div class="app" id="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-title">Hermes</div>
          <div class="status" id="connection-text">Connecting...</div>
        </div>
        <div class="toolbar">
          <button class="btn" id="sidebar-collapse">Hide</button>
          <button class="btn" id="btn-create" aria-label="Create chat" title="Create chat">+</button>
        </div>
        <div class="chat-list" id="chat-list"></div>
      </aside>

      <main class="main">
        <header class="chat-header">
          <div class="chat-header-left">
            <button class="btn" id="sidebar-toggle">Channels</button>
            <div>
            <div id="chat-title">@broadcast</div>
            <div class="meta" id="transport-info">Cloud Relay</div>
            </div>
          </div>
          <div class="header-actions">
            <button class="btn" id="btn-settings">Settings</button>
            <button class="btn" id="btn-theme">Theme</button>
          </div>
        </header>
        <section class="chat-stage">
          <div class="top-banner" id="error-banner"></div>
          <section class="messages" id="chat-messages"></section>
          <div class="composer-wrap">
            <footer class="composer">
              <input id="message-input" placeholder="Message Hermes..." maxlength="800" />
              <button class="btn" id="send-btn" disabled>Send</button>
            </footer>
          </div>
        </section>
      </main>
    </div>

    <div class="modal" id="settings-overlay">
      <div class="modal-card">
        <h3 id="settings-title">Welcome</h3>
        <div class="field"><input id="settings-name" placeholder="Username" maxlength="20" /></div>
        <div class="modal-actions">
          <button class="btn" id="settings-cancel">Skip</button>
          <button class="btn" id="settings-save">Save</button>
        </div>
      </div>
    </div>

    <div class="modal" id="chat-modal">
      <div class="modal-card">
        <h3 id="chat-modal-title">Create Channel</h3>
        <div class="field"><input id="chat-modal-name" placeholder="@team" /></div>
        <div class="field" id="chat-modal-new-wrap" style="display:none"><input id="chat-modal-new-name" placeholder="@new-team" /></div>
        <div class="modal-actions">
          <button class="btn" id="chat-modal-cancel">Cancel</button>
          <button class="btn" id="chat-modal-confirm">Confirm</button>
        </div>
      </div>
    </div>
    <div class="chat-menu" id="chat-menu">
      <button id="chat-menu-rename">Rename</button>
      <button class="danger" id="chat-menu-delete">Delete</button>
    </div>

    <script src="/firebase-config.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
